<script>
(async()=>{'use strict';const $=id=>document.getElementById(id);const root=$('articleRoot');const id=new URLSearchParams(location.search).get('id')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const validUrl=s=>{try{const u=new URL(s,location.href);return ['http:','https:'].includes(u.protocol)?u.href:'';}catch{return '';}};const safeImage=s=>{s=String(s||'').trim();if(/^https:\/\//i.test(s))return s;if(/^assets\/[a-z0-9_./-]+$/i.test(s)&&!s.includes('..'))return s;return '';};const cfg=window.RADIO69_SUPABASE_CONFIG||{};let article=null;
try{if(window.supabase?.createClient&&/^https:\/\/.+\.supabase\.co$/.test(cfg.url||'')&&cfg.publishableKey&& !String(cfg.publishableKey).startsWith('IDE_')){const db=window.supabase.createClient(cfg.url,cfg.publishableKey);const r=await db.from('articles').select('*').eq('id',id).eq('status','published').maybeSingle();if(!r.error&&r.data){const x=r.data;article={id:x.id,title:x.title,category:x.category,tag:x.tag,excerpt:x.excerpt,image:x.image_url,imageAlt:x.image_alt,imageCaption:x.image_caption,readTime:x.read_time,publishedAt:x.published_at,updatedAt:x.content_updated_at||x.published_at,intro:x.intro,body:x.body,sources:x.sources,sourceNote:x.source_note,seoTitle:x.seo_title};}}}catch(e){console.warn('A központi cikk nem töltődött be, megpróbálom a helyi cikkadatbázist.',e);}
if(!article&&Array.isArray(window.RADIO69_ARTICLES))article=window.RADIO69_ARTICLES.find(a=>a.id===id&&!a.draft);
if(!article){root.innerHTML='<div class="cloud-article-error"><span class="section-kicker">NEM TALÁLHATÓ</span><h1>A cikk nem érhető el.</h1><p>Lehet, hogy még vázlat, vagy a hivatkozás hibás.</p><a class="button button-primary" href="index.html#friss">Vissza az olvasnivalókhoz ↗</a></div>';return;}
const title=article.seoTitle||article.seo_title||article.title||'Cikk';document.title=title+' | Rádió69 × Zsiványok Podcast';const meta=document.querySelector('meta[name="description"]');if(meta)meta.content=article.excerpt||article.intro||title;const body=Array.isArray(article.body)?article.body:(typeof article.body==='string'?article.body.split(/\r?\n/):[]);const sources=Array.isArray(article.sources)?article.sources:[];const image=safeImage(article.image||article.image_url);const date=article.publishedAt||article.published_at||'';let dateText='';if(date){const d=new Date(date+'T00:00:00Z');if(!Number.isNaN(d.getTime()))dateText=d.toLocaleDateString('hu-HU',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'UTC'});}
root.innerHTML=`<nav class="breadcrumbs" aria-label="Morzsamenü"><a href="index.html#home">Főoldal</a><span>›</span><a href="index.html#friss">Olvasnivalók</a><span>›</span><span>${esc(article.title)}</span></nav><article class="longform-article"><header class="article-header"><span class="article-category-pill">${esc(article.tag||article.category||'CIKK')}</span><h1 class="cloud-article-title">${esc(article.title)}</h1><p class="article-deck">${esc(article.excerpt||'')}</p><div class="cloud-meta">${esc(article.category||'')} ${dateText?' · '+esc(dateText):''} · ${esc(article.readTime||article.read_time||'3 perc')} olvasás</div><div class="article-actions cloud-share-actions"><button type="button" id="shareArticle" class="small-action">↗ <span>Megosztás</span></button></div></header>${image?`<figure class="cloud-article-hero"><img src="${esc(image)}" alt="${esc(article.imageAlt||article.image_alt||article.title)}" loading="eager">${(article.imageCaption||article.image_caption)?`<figcaption class="cloud-caption">${esc(article.imageCaption||article.image_caption)}</figcaption>`:''}</figure>`:''}<div class="cloud-article-body">${article.intro?`<p class="intro">${esc(article.intro)}</p>`:''}${body.map(p=>`<p>${esc(p)}</p>`).join('')}${article.sourceNote||article.source_note?`<p class="editorial-note"><span>ⓘ</span>${esc(article.sourceNote||article.source_note)}</p>`:''}${sources.length?`<section class="cloud-source-list"><h2>Források</h2><ul>${sources.map(s=>{const u=validUrl(s.url);return u?`<li><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(s.label||u)}</a>${s.note?' – '+esc(s.note):''}</li>`:'';}).join('')}</ul></section>`:''}<a class="cloud-back" href="index.html#friss">← Vissza az olvasnivalókhoz</a></div></article>`;
})();
